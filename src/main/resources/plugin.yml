name: McLevel
version: 1.0.0
main: dev.spa.mclevel.McLevelPlugin
api-version: "1.20"
author: spa
depend:
  - LuckPerms
commands:
  level:
    description: 現在のレベルと次レベルへの進捗を表示します
    usage: /level
  mclevel:
    description: McLevel アドミンコマンド
    usage: /mclevel set <プレイヤー名> <0-3>
    permission: mclevel.admin
    permission-message: このコマンドを実行する権限がありません。
